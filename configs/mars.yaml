# MARS on LIBERO-Spatial with a frozen SmolVLA generalist and Pickup / Place specialists.
# Candidate queries come only from frozen SigLIP2 descriptions; there are no skill-ID embeddings.
router:
  type: mars
  z_dim: 960  # router reads only RL Token and normalized proprioception
  fusion: attention
  skill_query: true
  use_q: true
  q_dim: 8
  d_model: 128
  heads: 4
  dropout: 0.1
  ssm_layers: 2
  query_layers: 2
  d_state: 16
  window: 8
text:
  text_model: ViT-B-16-SigLIP2
  text_pretrained: webli
  skill_text:
    vla: move the robot arm to the black bowl and carry it
    pickup: grasp the black bowl by its rim and lift it up
    place: lower the held black bowl onto the plate and release it
train:
  epochs: 30
  lr: 1.0e-3
  batch_episodes: 8
  optimizer: adamw
  weight_decay: 1.0e-4
  select_best: true
  selection_metric: macro_f1
switch:
  switch_tau: 0.6
  switch_k: 2
  switch_cooldown: 0
